<div class="container">
  <div class="page-header">
    <h1>Competitors</h1>
    <a routerLink="/competitors/new" class="btn btn-primary" *ngIf="authService.hasAnyRole(['ADMINISTRATOR'])">+ New Competitor</a>
  </div>

  <div class="card">
    <div style="display:flex; gap:12px; margin-bottom:16px;">
      <select [(ngModel)]="typeFilter" (ngModelChange)="onFilterChange()" name="type">
        <option value="">All Types</option>
        <option value="DWARF">Dwarf</option>
        <option value="CAMEL">Camel</option>
        <option value="MEDIUM">Medium</option>
        <option value="OTHER">Other</option>
      </select>
      <select [(ngModel)]="statusFilter" (ngModelChange)="onFilterChange()" name="status">
        <option value="">All Statuses</option>
        <option value="ACTIVE">Active</option>
        <option value="INJURED">Injured</option>
        <option value="SUSPENDED">Suspended</option>
        <option value="RETIRED">Retired</option>
      </select>
    </div>

    <div class="loading" *ngIf="loading">Loading...</div>
    <div class="alert alert-error" *ngIf="errorMessage">{{ errorMessage }}</div>
    <div class="empty-state" *ngIf="!loading && competitors.length === 0">No competitors found.</div>

    <table *ngIf="!loading && competitors.length > 0">
      <thead>
        <tr><th>Nickname</th><th>Name</th><th>Type</th><th>Status</th><th>Country</th><th></th></tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of competitors">
          <td>{{ c.nickname }}</td>
          <td>{{ c.name }}</td>
          <td>{{ c.type }}</td>
          <td><span class="badge badge-{{ c.status.toLowerCase() }}">{{ c.status }}</span></td>
          <td>{{ c.countryOfOrigin }}</td>
          <td *ngIf="authService.hasAnyRole(['ADMINISTRATOR'])">
            <a [routerLink]="['/competitors', c.id, 'edit']" class="btn btn-secondary">Edit</a>
            <button class="btn btn-danger" (click)="deleteCompetitor(c.id)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="pagination" *ngIf="!loading && totalPages > 1">
      <button class="btn btn-secondary" (click)="prevPage()" [disabled]="page === 0">Previous</button>
      <span>Page {{ page + 1 }} of {{ totalPages }}</span>
      <button class="btn btn-secondary" (click)="nextPage()" [disabled]="page >= totalPages - 1">Next</button>
    </div>
  </div>
</div>
