<div class="container">
  <div class="page-header">
    <h1>Races</h1>
    <a routerLink="/races/new" class="btn btn-primary" *ngIf="authService.hasAnyRole(['ADMINISTRATOR', 'RACE_ORGANIZER'])">+ New Race</a>
  </div>

  <div class="card">
    <select [(ngModel)]="statusFilter" (ngModelChange)="onFilterChange()" name="status" style="margin-bottom:16px">
      <option value="">All Statuses</option>
      <option value="DRAFT">Draft</option>
      <option value="OPEN_FOR_REGISTRATION">Open for Registration</option>
      <option value="CLOSED_FOR_REGISTRATION">Closed for Registration</option>
      <option value="IN_PROGRESS">In Progress</option>
      <option value="COMPLETED">Completed</option>
      <option value="CANCELLED">Cancelled</option>
    </select>

    <div class="loading" *ngIf="loading">Loading...</div>
    <div class="alert alert-error" *ngIf="errorMessage">{{ errorMessage }}</div>
    <div class="empty-state" *ngIf="!loading && races.length === 0">No races found.</div>

    <table *ngIf="!loading && races.length > 0">
      <thead><tr><th>Name</th><th>Type</th><th>Status</th><th>Scheduled</th><th></th></tr></thead>
      <tbody>
        <tr *ngFor="let r of races">
          <td>{{ r.name }}</td>
          <td>{{ r.type }}</td>
          <td><span class="badge badge-{{ r.status.toLowerCase() }}">{{ r.status }}</span></td>
          <td>{{ r.scheduledDateTime | date:'medium' }}</td>
          <td><a [routerLink]="['/races', r.id]" class="btn btn-secondary">View</a></td>
        </tr>
      </tbody>
    </table>

    <div class="pagination" *ngIf="!loading && totalPages > 1">
      <button class="btn btn-secondary" (click)="prevPage()" [disabled]="page === 0">Previous</button>
      <span>Page {{ page + 1 }} of {{ totalPages }}</span>
      <button class="btn btn-secondary" (click)="nextPage()" [disabled]="page >= totalPages - 1">Next</button>
    </div>
  </div>
</div>
