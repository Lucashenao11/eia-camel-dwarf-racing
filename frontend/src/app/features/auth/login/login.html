<div class="container" style="max-width: 400px; margin-top: 60px;">
  <div class="card">
    <h2>Login</h2>
    <div class="alert alert-error" *ngIf="errorMessage">{{ errorMessage }}</div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Username</label>
        <input type="text" formControlName="username" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" />
      </div>
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid || loading" style="width:100%">
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <p style="margin-top:14px; text-align:center; font-size:14px;">
      No account? <a routerLink="/register">Register here</a>
    </p>
  </div>
</div>
