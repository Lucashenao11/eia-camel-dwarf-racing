services:
  postgres:
    image: postgres:16
    container_name: camel-dwarf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: camel_dwarf_racing
      POSTGRES_USER: race_admin
      POSTGRES_PASSWORD: race_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U race_admin"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - racing-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: camel-dwarf-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: camel_dwarf_racing
      DB_USERNAME: race_admin
      DB_PASSWORD: race_password
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 3600000
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - racing-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: camel-dwarf-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - racing-network

networks:
  racing-network:
    driver: bridge

volumes:
  postgres_data: