spring:
  application:
    name: camel-dwarf-racing-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:camel_dwarf_racing}
    username: ${DB_USERNAME:race_admin}
    password: ${DB_PASSWORD:race_password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-string-at-least-256-bits-for-hs256}
  expiration-ms: ${JWT_EXPIRATION:3600000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

team:
  max-members: ${TEAM_MAX_MEMBERS:5}